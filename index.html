<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nordic Dental Club — Team Survey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --porcelain: #F6F3EC;
    --porcelain-2: #EFEBE0;
    --charcoal: #4D5647;
    --green: #4D5647;
    --green-dark: #3A4136;
    --sea-glass: #B1BB8B;
    --ash-wood: #C9AE8C;
    --line: #DAD4C4;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--porcelain);
    color: var(--charcoal);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  .logo {
    width: 260px;
    max-width: 70%;
    height: auto;
    margin: 0 auto 22px;
    display: block;
  }

  .logo.small {
    width: 180px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--green);
    margin-bottom: 10px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .sub {
    font-size: 15px;
    color: #5C5A52;
    max-width: 440px;
    margin: 0 auto;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    margin: 28px 0 44px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.3s ease;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--green);
    margin-bottom: 6px;
  }

  .section-title {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .section-note {
    font-size: 14px;
    color: #77746A;
    margin-bottom: 22px;
  }

  .q {
    margin-bottom: 26px;
  }
  .q:last-child { margin-bottom: 0; }

  .q-text {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .q-hint {
    font-size: 13px;
    color: #8A8778;
    margin-bottom: 12px;
  }

  input[type="text"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--charcoal);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--porcelain);
    resize: vertical;
  }

  textarea { min-height: 80px; }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--green);
    background: #fff;
  }

  .scale-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .scale-label {
    font-size: 12px;
    color: #8A8778;
    flex: 0 0 68px;
  }
  .scale-label.right { text-align: right; }

  .scale-options {
    display: flex;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }

  .scale-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    color: var(--charcoal);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .scale-btn:hover { border-color: var(--sea-glass); }

  .scale-btn.selected {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    background: var(--porcelain);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option:hover { border-color: var(--sea-glass); }

  .option.selected {
    border-color: var(--green);
    background: #fff;
  }

  .option input { display: none; }

  .box {
    width: 17px;
    height: 17px;
    flex: none;
    margin-top: 2px;
    border: 1.5px solid #B5B2A4;
    border-radius: 3px;
    background: #fff;
    position: relative;
  }

  .option.selected .box {
    background: var(--green);
    border-color: var(--green);
  }

  .option.selected .box::after {
    content: '';
    position: absolute;
    left: 5px; top: 1px;
    width: 4px; height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .option.radio .box { border-radius: 50%; }
  .option.radio.selected .box::after {
    left: 4px; top: 4px; width: 7px; height: 7px;
    border: none; border-radius: 50%; background: #fff;
    transform: none;
  }

  .option-text { font-size: 14.5px; padding-top: 1px; }

  .matrix-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--porcelain-2);
  }
  .matrix-row:first-child { padding-top: 0; }
  .matrix-row:last-child { border-bottom: none; padding-bottom: 0; }

  .matrix-label {
    font-size: 14.5px;
    font-weight: 500;
    margin-bottom: 10px;
  }

  .matrix-pills {
    display: flex;
    gap: 6px;
  }

  .pill {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 4px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--porcelain);
    color: var(--charcoal);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }

  .pill:hover { border-color: var(--sea-glass); }

  .pill.selected {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  button.nav {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: #fff;
    color: var(--charcoal);
    cursor: pointer;
  }

  button.nav.primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  button.nav.primary:hover { background: var(--green-dark); }
  button.nav:disabled { opacity: 0.35; cursor: default; }
  button.nav.ghost {
    background: none;
    border: none;
    color: #8A8778;
  }

  .step-count {
    font-size: 12px;
    color: #9A9788;
    text-align: center;
    margin-top: 14px;
  }

  .done-screen {
    text-align: center;
    padding: 60px 20px;
  }

  .done-screen .emblem { width: 48px; height: 48px; }

  .done-screen h1 { margin-bottom: 10px; }

  .error-banner {
    background: #FBEEEE;
    border: 1px solid #E3B8B8;
    color: #8A3A3A;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    display: none;
  }

  .owner-link {
    text-align: center;
    margin-top: 36px;
  }

  .owner-link a {
    font-size: 12px;
    color: #A8A498;
    text-decoration: none;
  }

  .owner-link a:hover { color: var(--green); text-decoration: underline; }

  .gate {
    max-width: 320px;
    margin: 60px auto 0;
    text-align: center;
  }

  .gate input {
    text-align: center;
    margin: 16px 0;
  }

  .gate-error {
    font-size: 13px;
    color: #A94444;
    display: none;
    margin-bottom: 10px;
  }

  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .dash-count {
    font-size: 14px;
    color: #77746A;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }

  .stat-q {
    font-size: 12.5px;
    color: #6E6B60;
    margin-bottom: 8px;
    line-height: 1.35;
  }

  .stat-avg {
    font-size: 26px;
    font-weight: 700;
    color: var(--green);
  }

  .stat-avg .of5 { font-size: 14px; color: #A8A498; font-weight: 500; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 12px;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--porcelain-2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--sea-glass);
  }

  .bar-label { flex: 0 0 auto; color: #6E6B60; }
  .bar-count { flex: 0 0 22px; text-align: right; color: #A8A498; }

  .tally-card { margin-bottom: 20px; }

  .response-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .response-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #A8A498;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--porcelain-2);
    padding-bottom: 8px;
  }

  .response-meta strong { color: var(--charcoal); font-size: 13px; }

  .response-item { margin-bottom: 10px; }
  .response-item:last-child { margin-bottom: 0; }

  .response-q {
    font-size: 12.5px;
    font-weight: 600;
    color: #77746A;
    margin-bottom: 2px;
  }

  .response-a {
    font-size: 14px;
    color: var(--charcoal);
    white-space: pre-wrap;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #8A8778;
    font-size: 14px;
  }

  @media (max-width: 420px) {
    .stat-grid { grid-template-columns: 1fr; }
    .wrap { padding: 32px 16px 80px; }
    .scale-label { display: none; }
    .scale-options { justify-content: space-between; }
    .scale-btn { width: 32px; height: 32px; }
  }
</style>
</head>

      ]

  const state = {};
  let step = 0;
  const host = document.getElementById('formHost');
  const fill = document.getElementById('progressFill');
  const errorBanner = document.getElementById('errorBanner');

  function setVal(id, val) { state[id] = val; }

  function scaleRow(q) {
    let btns = '';
    for (let i = 1; i <= 5; i++) {
      const sel = state[q.id] === i ? ' selected' : '';
      btns += `<button type="button" class="scale-btn${sel}" data-q="${q.id}" data-v="${i}">${i}</button>`;
    }
    return `<div class="scale-row">
      <span class="scale-label">${q.left}</span>
      <div class="scale-options">${btns}</div>
      <span class="scale-label right">${q.right}</span>
    </div>`;
  }

  function checkboxGroup(q) {
    const cur = state[q.id] || [];
    return `<div class="options">${q.options.map(opt => {
      const sel = cur.includes(opt) ? ' selected' : '';
      return `<label class="option${sel}" data-q="${q.id}" data-opt="${opt}">
        <span class="box"></span><span class="option-text">${opt}</span>
      </label>`;
    }).join('')}</div>`;
  }

  function radioGroup(q) {
    const cur = state[q.id];
    return `<div class="options">${q.options.map(opt => {
      const sel = cur === opt ? ' selected' : '';
      return `<label class="option radio${sel}" data-q="${q.id}" data-opt="${opt}">
        <span class="box"></span><span class="option-text">${opt}</span>
      </label>`;
    }).join('')}</div>`;
  }

  function matrixGroup(q) {
    const cur = state[q.id] || {};
    return `<div class="matrix">${q.rows.map(row => {
      return `<div class="matrix-row">
        <div class="matrix-label">${row}</div>
        <div class="matrix-pills">${q.levels.map(level => {
          const sel = cur[row] === level ? ' selected' : '';
          return `<button type="button" class="pill${sel}" data-q="${q.id}" data-row="${row}" data-level="${level}">${level}</button>`;
        }).join('')}</div>
      </div>`;
    }).join('')}</div>`;
  }

  function renderQuestion(q) {
    let inner = '';
    if (q.type === 'text') {
      inner = `<input type="text" data-q="${q.id}" value="${state[q.id] || ''}" />`;
    } else if (q.type === 'textarea') {
      inner = `<textarea data-q="${q.id}">${state[q.id] || ''}</textarea>`;
    } else if (q.type === 'scale') {
      inner = scaleRow(q);
    } else if (q.type === 'checkbox') {
      inner = checkboxGroup(q);
    } else if (q.type === 'radio') {
      inner = radioGroup(q);
    } else if (q.type === 'matrix') {
      inner = matrixGroup(q);
    }
    const hint = q.hint ? `<div class="q-hint">${q.hint}</div>` : '';
    const label = q.type === 'text' ? '' : `<div class="q-text">${q.text}</div>`;
    const textLabel = q.type === 'text' ? `<div class="q-text">${q.text}</div>` : '';
    return `<div class="q">${textLabel || label}${hint}${inner}</div>`;
  }

  function render() {
    const s = sections[step];
    const isLast = step === sections.length - 1;
    const html = `
      <div class="card">
        <div class="section-label">${s.label}</div>
        <div class="section-title">${s.title}</div>
        ${s.note ? `<div class="section-note">${s.note}</div>` : ''}
        ${s.questions.map(renderQuestion).join('')}
      </div>
      <div class="nav-row">
        ${step > 0 ? `<button class="nav ghost" id="backBtn">Back</button>` : `<span></span>`}
        <button class="nav primary" id="nextBtn">${isLast ? 'Submit survey' : 'Continue'}</button>
      </div>
      <div class="step-count">Section ${step + 1} of ${sections.length}</div>
    `;
    host.innerHTML = html;
    fill.style.width = `${((step + 1) / sections.length) * 100}%`;
    attachHandlers();
  }

  function attachHandlers() {
    host.querySelectorAll('input[type="text"]').forEach(el => {
      el.addEventListener('input', e => setVal(e.target.dataset.q, e.target.value));
    });
    host.querySelectorAll('textarea').forEach(el => {
      el.addEventListener('input', e => setVal(e.target.dataset.q, e.target.value));
    });
    host.querySelectorAll('.scale-btn').forEach(el => {
      el.addEventListener('click', e => {
        setVal(el.dataset.q, parseInt(el.dataset.v, 10));
        render();
      });
    });
    host.querySelectorAll('.option.radio').forEach(el => {
      el.addEventListener('click', () => {
        setVal(el.dataset.q, el.dataset.opt);
        render();
      });
    });
    host.querySelectorAll('.pill').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.q, row = el.dataset.row, level = el.dataset.level;
        const cur = state[id] || {};
        cur[row] = level;
        setVal(id, cur);
        render();
      });
    });
    host.querySelectorAll('.option:not(.radio)').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.q, opt = el.dataset.opt;
        const cur = state[id] || [];
        const idx = cur.indexOf(opt);
        if (idx > -1) cur.splice(idx, 1); else cur.push(opt);
        setVal(id, cur);
        render();
      });
    });
    const backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.addEventListener('click', () => { step--; window.scrollTo(0,0); render(); });
    document.getElementById('nextBtn').addEventListener('click', onNext);
  }

  async function onNext() {
    const isLast = step === sections.length - 1;
    if (!isLast) {
      step++;
      window.scrollTo(0, 0);
      render();
      return;
    }
    const btn = document.getElementById('nextBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try {
      const payload = Object.assign({}, state);
      payload.submittedAt = new Date().toLocaleString();
      if (Array.isArray(payload.q12)) payload.q12 = payload.q12.join(', ');
      if (payload.q_interest && typeof payload.q_interest === 'object') {
        payload.q_interest = Object.entries(payload.q_interest).map(([k, v]) => `${k}: ${v}`).join(' | ');
      }
      const res = await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('submit failed');
      showDone();
    } catch (err) {
      errorBanner.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit survey';
    }
  }
